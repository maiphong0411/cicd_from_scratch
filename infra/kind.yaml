kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# let the node read per-registry settings from this folder (needed to reach our local registry)
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    # forward one Mac port to each environment's NodePort: develop 8081, uat 8082, prod 8083
    extraPortMappings:
      - containerPort: 30081
        hostPort: 8081
        listenAddress: 127.0.0.1
      - containerPort: 30082
        hostPort: 8082
        listenAddress: 127.0.0.1
      - containerPort: 30083
        hostPort: 8083
        listenAddress: 127.0.0.1
