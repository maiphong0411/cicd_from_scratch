kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# let the node read per-registry settings from this folder (needed to reach our local registry)
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    # forward the Mac's port 8081 to the node's port 30080, where the app will be exposed
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8081
        listenAddress: 127.0.0.1
