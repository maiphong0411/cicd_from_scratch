jenkins:
  numExecutors: 1
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
unclassified:
  location:
    url: http://localhost:8080/
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              id: sonar-token
              scope: GLOBAL
              secret: ${SONAR_TOKEN}
jobs:
  - script: |
      // one job per branch, created automatically; each runs the Jenkinsfile found on that branch
      multibranchPipelineJob('app') {
        branchSources {
          git {
            id('app')
            remote('file:///repo')
            includes('develop uat prod')
          }
        }
        // look for new commits on those branches every minute
        triggers {
          periodicFolderTrigger { interval('1m') }
        }
      }
